name: CI

# Every push to main and every pull request must build and pass the full
# test suite — including the webOS 6 (Chromium 79) baseline gate, the tsc
# type gate, and the packaging byte-identity gate (ares is installed so the
# gate runs for real, not skipped).
#
# Releases are separate and tag-driven — see release.yml.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ares (webOS packaging gate)
        run: pnpm add -g @webos-tools/cli

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test
