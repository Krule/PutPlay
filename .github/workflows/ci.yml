name: CI

# Every push to main and every pull request must build and pass the full
# test suite — including the webOS 6 (Chromium 79) baseline gate, the tsc
# type gate, and the packaging byte-identity gate (ares is installed so the
# gate runs for real, not skipped).
#
# Releases are separate and tag-driven — see release.yml.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ares (webOS packaging gate)
        # pnpm 12 hard-errors if its global bin dir is off PATH (pnpm 10 only
        # warned); action-setup sets PNPM_HOME, the bin dir is $PNPM_HOME/bin.
        # GITHUB_PATH carries it to the packaging-gate steps that run ares.
        run: |
          export PATH="$PNPM_HOME/bin:$PATH"
          echo "$PNPM_HOME/bin" >> "$GITHUB_PATH"
          pnpm add -g @webos-tools/cli

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test
