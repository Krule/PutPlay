name: Release

# On tag vX.Y.Z: build, test, package ba.ovo.putplay_X.Y.Z_all.ipk, and publish a
# GitHub release named vX.Y.Z with the ipk attached.
#
# The tag is the single source of truth for the version — the workflow writes
# it into package.json (ipk file name) and appinfo.json (webOS app identity)
# before building, so the ipk, the installed app, and the release can never
# disagree. On failure no release is created: fix and push a new tag.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ares (webOS packaging)
        # pnpm 12 hard-errors if its global bin dir is off PATH (pnpm 10 only
        # warned); action-setup sets PNPM_HOME, the bin dir is $PNPM_HOME/bin.
        # GITHUB_PATH carries it to the Package ipk step (ares-package).
        run: |
          export PATH="$PNPM_HOME/bin:$PATH"
          echo "$PNPM_HOME/bin" >> "$GITHUB_PATH"
          pnpm add -g @webos-tools/cli

      - name: Apply release version from tag
        id: ver
        run: |
          node build/release-version.mjs "$GITHUB_REF_NAME"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Package ipk
        run: node build/package.mjs

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: ba.ovo.putplay_${{ steps.ver.outputs.version }}_all.ipk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Update Homebrew Channel repo.json (on main)
        # Homebrew Channel apps are discovered via a static repo.json on main.
        # The release runner sits on the tag (detached), so base the update on
        # a fresh fetch of main: compute the entry from the real ipk
        # (sha256 + size, never hand-entered), commit onto main, push.
        run: |
          curl -fsSL -o /tmp/repo-current.json \
            "https://raw.githubusercontent.com/${{ github.repository }}/main/repo.json" \
            || echo '{"packages": []}' > /tmp/repo-current.json
          node build/update-repo.mjs \
            --app-id ba.ovo.putplay \
            --title "PutPlay" \
            --version "${{ steps.ver.outputs.version }}" \
            --tag "$GITHUB_REF_NAME" \
            --ipk "ba.ovo.putplay_${{ steps.ver.outputs.version }}_all.ipk" \
            --repo "https://github.com/${{ github.repository }}" \
            --current /tmp/repo-current.json \
            --out /tmp/repo-next.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --depth 1
          git checkout --detach origin/main
          cp /tmp/repo-next.json repo.json
          git add repo.json
          if git diff --cached --quiet; then
            echo "repo.json already up to date"
          else
            git commit -m "Homebrew: $GITHUB_REF_NAME"
            git push origin HEAD:main
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
