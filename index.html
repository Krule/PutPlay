<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>put.io</title>
  <link rel="stylesheet" href="js/bundle.css" />
<script>
window.__errs=[];
window.addEventListener('error',e=>{window.__errs.push((e.error&&e.error.stack)||e.message); console.error('PROBE', e.message, e.filename, e.lineno)});
window.addEventListener('unhandledrejection',e=>{window.__errs.push('rej:'+(e.reason&&(e.reason.stack||e.reason.message)||e.reason))});
</script></head>
<body>
  <div id="app"></div>
  <script src="js/bundle.js"></script>
</body>
</html>
